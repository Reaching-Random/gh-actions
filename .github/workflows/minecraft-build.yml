# Reusable workflow for building Minecraft Fabric mods.
#
# Handles:
#   - Standard CI builds (push / pull_request)
#   - Release builds: computes next semver tag scoped to the MC version,
#     builds with that version, then creates a GitHub tag + release on success.
#   - Modrinth: release builds also upload the jar as a Modrinth version when the
#     calling repo has a MODRINTH_PROJECT_ID variable and a MODRINTH_TOKEN secret.
#
# Tag format: {minecraft_version}-v{mod_version}
#   e.g.  1.21.11-v0.3.1   or   26.1-v1.2.0
#
# Version computation rules (driven by mod_version in gradle.properties):
#   mod_version supplies minimum major.minor. The patch is always auto-incremented.
#   - If no tags exist yet → use template version (patch = 0)
#   - If latest tag major < template major → bump to template major, reset minor/patch
#   - If latest tag minor < template minor (at current major) → bump to template minor, reset patch
#   - Otherwise → increment patch

name: Minecraft Mod Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      minecraft_version:
        description: 'Minecraft version (e.g. 1.21.11 or 26.1)'
        required: true
        type: string
      java_version:
        description: 'Java version to build with'
        required: true
        type: string
      create_release:
        description: 'Compute next version, tag, and publish a GitHub release'
        required: false
        type: boolean
        default: false
    secrets:
      gemini_api_key:
        description: 'Gemini API key for generating release notes'
        required: false
      modrinth_token:
        description: 'Modrinth PAT (scope: Create versions). Publishing also needs the MODRINTH_PROJECT_ID repo variable'
        required: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    outputs:
      mod_version:  ${{ steps.version.outputs.mod_version }}
      tag:          ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history + tags required for version computation
          fetch-depth: 0

      - name: Compute next release version
        id: version
        if: inputs.create_release
        env:
          MC_VERSION: ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail

          # ── Read template from gradle.properties ─────────────────────────
          TMPL=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TMPL_MAJOR=$(echo "$TMPL" | cut -d. -f1)
          TMPL_MINOR=$(echo "$TMPL" | cut -d. -f2)

          echo "Template version : ${TMPL} (major≥${TMPL_MAJOR}, minor≥${TMPL_MINOR})"

          # ── Find latest existing tag for this MC version ──────────────────
          PREFIX="${MC_VERSION}-v"

          LATEST=$(git tag -l "${PREFIX}*" \
            | sed "s|^${PREFIX}||" \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)

          echo "Latest tag suffix: ${LATEST:-<none>}"

          # ── Compute next version ──────────────────────────────────────────
          if [ -z "$LATEST" ]; then
            NEW_VERSION="${TMPL_MAJOR}.${TMPL_MINOR}.0"
            PREVIOUS_TAG=""
          else
            PREVIOUS_TAG="${PREFIX}${LATEST}"
            CUR_MAJOR=$(echo "$LATEST" | cut -d. -f1)
            CUR_MINOR=$(echo "$LATEST" | cut -d. -f2)
            CUR_PATCH=$(echo "$LATEST" | cut -d. -f3)

            if [ "$TMPL_MAJOR" -gt "$CUR_MAJOR" ]; then
              # Major floor raised — reset minor + patch
              NEW_VERSION="${TMPL_MAJOR}.${TMPL_MINOR}.0"
            elif [ "$TMPL_MINOR" -gt "$CUR_MINOR" ]; then
              # Minor floor raised (within same major) — reset patch
              NEW_VERSION="${CUR_MAJOR}.${TMPL_MINOR}.0"
            else
              # Same major.minor — increment patch
              NEW_PATCH=$(( CUR_PATCH + 1 ))
              NEW_VERSION="${CUR_MAJOR}.${CUR_MINOR}.${NEW_PATCH}"
            fi
          fi

          TAG="${PREFIX}${NEW_VERSION}"
          echo "New version : ${NEW_VERSION}"
          echo "New tag     : ${TAG}"

          echo "mod_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"                 >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'microsoft'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          MOD_VERSION="${{ steps.version.outputs.mod_version }}"
          if [ -n "$MOD_VERSION" ]; then
            echo "Building with overridden mod_version=${MOD_VERSION}"
            ./gradlew build -Pmod_version="$MOD_VERSION"
          else
            ./gradlew build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  release:
    name: Tag & Release
    runs-on: ubuntu-24.04
    needs: build
    # Only run when a release was requested AND the build succeeded
    if: inputs.create_release && needs.build.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Artifacts
          path: build/libs/

      - name: Create git tag
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate release notes
        env:
          GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
          PREVIOUS_TAG:   ${{ needs.build.outputs.previous_tag }}
        run: |
          set -e -E
          
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set, skipping AI generation."
            exit 0
          fi
          
          MODEL_ID="gemini-3.1-flash-lite"
          GENERATE_CONTENT_API="generateContent"
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release detected. Fetching all commits."
            COMMITS=$(git log HEAD --no-merges --pretty=format:'%s%n%b')
          else
            echo "Fetching commits from ${PREVIOUS_TAG} to HEAD."
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'%s%n%b')
          fi
          
          if [ -z "$COMMITS" ]; then
            echo "No commits found to summarize."
            exit 0
          fi
          
          PROMPT="You are a release assistant that summarizes Git commit histories into clear, human-readable release notes.

          Guidelines:
          - Write the first line as a succinct one-sentence title (for example, ‘Adds retry logic and job fix’), then include a blank line followed by formatted release notes.
          - Group related changes together under headers (✨ Features, 🐛 Fixes, 🧹 Maintenance).
          - Ignore trivial commits like version bumps or formatting.
          - Be concise and professional (5–10 short bullet points max).
          - Do not include commit hashes, author names, or dates.
          - Do not include any other detail than the summary (e.g., no 'here's the summary'). The only output should be the markdown that will be used as the tag comment.

          Now summarize the following commit history:
          ---
          $COMMITS
          ---"
          
          RESPONSE=$(jq -n --arg text "$PROMPT" '{
            contents: [{role: "user", parts: [{text: $text}]}],
            generationConfig: {temperature: 0.7}
          }' | curl -s -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:${GENERATE_CONTENT_API}?key=${GEMINI_API_KEY}" \
            -d @-)
          
          if ! echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
            echo "❌ Invalid JSON response from Gemini API:"
            echo "$RESPONSE"
            exit 1
          fi
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          
          if [ -z "$SUMMARY" ]; then
            echo "❌ No summary text returned. Full response:"
            echo "$RESPONSE"
            # Proceed without creating the release notes file.
            exit 0
          fi
          
          echo "$SUMMARY" > release_notes.md
          echo "Generated AI release notes successfully."

      - name: Create GitHub release
        env:
          GH_TOKEN:    ${{ github.token }}
          TAG:         ${{ needs.build.outputs.tag }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC_VERSION:  ${{ inputs.minecraft_version }}
          REPO_NAME:   ${{ github.event.repository.name }}
        run: |
          NOTES_CONTENT=$(cat <<EOF
          ## ${REPO_NAME} — v${MOD_VERSION}
          
          **Minecraft version:** ${MC_VERSION}
          
          ---
          
          EOF
          )
          
          # Clean up the leading whitespace from the EOF block
          NOTES_CONTENT=$(echo -e "\n$NOTES_CONTENT" | sed -E 's/^[[:space:]]+//')

          if [ -f release_notes.md ]; then
            echo "$NOTES_CONTENT" > final_notes.md
            cat release_notes.md >> final_notes.md
            
            gh release create "$TAG" build/libs/*.jar \
              --title "v${MOD_VERSION} — Minecraft ${MC_VERSION}" \
              --notes-file final_notes.md
          else
            echo "$NOTES_CONTENT" > final_notes.md
            gh release create "$TAG" build/libs/*.jar \
              --title "v${MOD_VERSION} — Minecraft ${MC_VERSION}" \
              --notes-file final_notes.md \
              --generate-notes
          fi

      # Skipped unless the calling repo sets the MODRINTH_PROJECT_ID variable.
      - name: Publish to Modrinth
        if: vars.MODRINTH_PROJECT_ID != ''
        env:
          GH_TOKEN:       ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}
          PROJECT_ID:     ${{ vars.MODRINTH_PROJECT_ID }}
          TAG:            ${{ needs.build.outputs.tag }}
          MOD_VERSION:    ${{ needs.build.outputs.mod_version }}
          MC_VERSION:     ${{ inputs.minecraft_version }}
        run: |
          set -euo pipefail

          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "❌ MODRINTH_PROJECT_ID is set but the MODRINTH_TOKEN secret is missing."
            exit 1
          fi

          JAR=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -1)
          echo "Uploading ${JAR}"

          # Reuse the GitHub release notes, minus the header above the first '---'.
          BODY=$(gh release view "$TAG" --json body -q .body)
          CHANGELOG=$(printf '%s\n' "$BODY" | awk 'found{print} /^---$/{found=1}')
          [ -n "$CHANGELOG" ] || CHANGELOG="$BODY"

          # P7dR8mSH = Fabric API
          jq -n \
            --arg project_id "$PROJECT_ID" \
            --arg name "v${MOD_VERSION} — Minecraft ${MC_VERSION}" \
            --arg version_number "${MOD_VERSION}+${MC_VERSION}" \
            --arg changelog "$CHANGELOG" \
            --arg mc "$MC_VERSION" \
            '{
              project_id: $project_id,
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              game_versions: [$mc],
              loaders: ["fabric"],
              version_type: "release",
              featured: false,
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
              file_parts: ["jar"],
              primary_file: "jar"
            }' > modrinth.json

          HTTP=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -H "User-Agent: ${GITHUB_REPOSITORY}/${MOD_VERSION} (github-actions)" \
            -F "data=<modrinth.json;type=application/json" \
            -F "jar=@${JAR};type=application/java-archive")

          if [ "$HTTP" != "200" ]; then
            echo "❌ Modrinth upload failed (HTTP ${HTTP}):"
            cat response.json
            exit 1
          fi
          echo "✅ Published https://modrinth.com/mod/${PROJECT_ID}/version/$(jq -r .id response.json)"
